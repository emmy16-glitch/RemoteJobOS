name: Review application queue

on:
  schedule:
    # Offset from the top of the hour to reduce GitHub scheduler congestion.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
    inputs:
      max_tasks:
        description: "Maximum application reviews for this run"
        required: false
        default: "10"
        type: string

permissions:
  contents: read

concurrency:
  group: application-review-queue
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REMOTEJOBOS_MAX_REVIEW_TASKS: ${{ inputs.max_tasks || '10' }}
      REMOTEJOBOS_MAX_AUTO_SUBMIT_TASKS: ${{ inputs.max_tasks || '10' }}
      REMOTEJOBOS_ALLOW_SUBMIT: "false"
      ENRICHMENT_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify required cloud secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Process leased application dry-run tasks
        run: npm run worker:process-application-tasks
      - name: Submit only policy-authorized verified applications
        env:
          REMOTEJOBOS_ALLOW_SUBMIT: "true"
        run: npm run process-auto-submissions --workspace @remotejobos/worker -- "${{ inputs.max_tasks || '10' }}"
      - name: Upload non-sensitive browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-review-evidence-${{ github.run_id }}
          path: artifacts/screenshots/
          if-no-files-found: ignore
          retention-days: 7
