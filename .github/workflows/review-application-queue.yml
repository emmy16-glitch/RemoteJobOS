name: Review application queue

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      max_tasks:
        description: "Maximum application reviews for this run"
        required: false
        default: "20"
        type: string
  workflow_run:
    workflows: ["Match remote jobs"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/review-application-queue.yml"
      - "apps/worker/src/apply/**"
      - "apps/worker/src/application-queue.ts"
      - "apps/worker/src/target-enrichment.ts"
      - "apps/worker/src/persist.ts"
      - "apps/worker/src/agent-harness.ts"
      - "apps/worker/src/prepare-cvs.ts"
      - "apps/worker/src/sources/remotive.ts"
      - "packages/core/src/planner.ts"
      - "packages/core/src/scoring.ts"
      - "packages/core/src/job-target.ts"

permissions:
  contents: read

concurrency:
  group: remotejobos-review-queue-v2
  # Review runs are dry-run/idempotent. A newer commit must pre-empt stale
  # workers so fixes do not sit queued behind old code for many minutes.
  cancel-in-progress: true

jobs:
  prepare:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ENRICHMENT_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify required cloud secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Re-score the current remote-job snapshot
        run: npm run worker:match
      - name: Resolve aggregator jobs to verified employer targets
        run: npm run worker:enrich-targets
      - name: Prepare CV plans for newest strong matches
        run: npm run worker:prepare-cvs
      - name: Create or refresh application rows and queue review tasks
        run: npm run worker:sync-applications

  review:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REMOTEJOBOS_MAX_REVIEW_TASKS: ${{ inputs.max_tasks || '20' }}
      REMOTEJOBOS_MAX_AUTO_SUBMIT_TASKS: ${{ inputs.max_tasks || '20' }}
      REMOTEJOBOS_HARD_BATCH_CAP: "100"
      REMOTEJOBOS_WORKER_SHARD: ${{ matrix.shard }}
      REMOTEJOBOS_ALLOW_SUBMIT: "false"
      ENRICHMENT_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify required cloud secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Process leased application dry-run tasks
        run: npm run worker:process-application-tasks
      - name: Submit only policy-authorized verified applications
        env:
          REMOTEJOBOS_ALLOW_SUBMIT: "true"
        run: npm run process-auto-submissions --workspace @remotejobos/worker -- "${{ inputs.max_tasks || '20' }}"
      - name: Upload non-sensitive browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-review-evidence-${{ github.run_id }}-${{ matrix.shard }}
          path: artifacts/screenshots/
          if-no-files-found: ignore
          retention-days: 7
