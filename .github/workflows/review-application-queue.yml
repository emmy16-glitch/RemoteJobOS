name: Review application queue

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      max_tasks:
        description: "Maximum application reviews for this run"
        required: false
        default: "10"
        type: string

permissions:
  contents: read

jobs:
  review:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REMOTEJOBOS_MAX_REVIEW_TASKS: ${{ inputs.max_tasks || '10' }}
      REMOTEJOBOS_MAX_AUTO_SUBMIT_TASKS: ${{ inputs.max_tasks || '10' }}
      REMOTEJOBOS_HARD_BATCH_CAP: "100"
      REMOTEJOBOS_WORKER_SHARD: ${{ matrix.shard }}
      REMOTEJOBOS_ALLOW_SUBMIT: "false"
      ENRICHMENT_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify required cloud secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Process leased application dry-run tasks
        run: npm run worker:process-application-tasks
      - name: Submit only policy-authorized verified applications
        env:
          REMOTEJOBOS_ALLOW_SUBMIT: "true"
        run: npm run process-auto-submissions --workspace @remotejobos/worker -- "${{ inputs.max_tasks || '10' }}"
      - name: Upload non-sensitive browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-review-evidence-${{ github.run_id }}-${{ matrix.shard }}
          path: artifacts/screenshots/
          if-no-files-found: ignore
          retention-days: 7
