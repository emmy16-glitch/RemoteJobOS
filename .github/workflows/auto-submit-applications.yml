name: Auto-submit verified applications

on:
  # Five-minute recovery catch-up, plus an immediate pass after review completes.
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_run:
    workflows: ["Review application queue"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/auto-submit-applications.yml"
      - "apps/worker/src/apply/**"
      - "apps/worker/src/application-queue.ts"
      - "apps/worker/src/agent-harness.ts"
  workflow_dispatch:
    inputs:
      max_tasks:
        description: "Maximum auto-submit tasks for this run"
        required: false
        default: "50"
        type: string

permissions:
  contents: read

concurrency:
  group: remotejobos-auto-submit
  cancel-in-progress: false

jobs:
  submit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      REMOTEJOBOS_ALLOW_SUBMIT: "true"
      REMOTEJOBOS_MAX_AUTO_SUBMIT_TASKS: ${{ inputs.max_tasks || '50' }}
      REMOTEJOBOS_HARD_BATCH_CAP: "100"
      ENRICHMENT_PROVIDER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Verify required cloud secrets
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Process policy-authorized submissions
        run: npm run process-auto-submissions --workspace @remotejobos/worker -- "${{ inputs.max_tasks || '50' }}"
      - name: Upload non-sensitive browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-submit-evidence-${{ github.run_id }}
          path: artifacts/screenshots/
          if-no-files-found: ignore
          retention-days: 7
